name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить зависимости
        run: npm install

      - name: Собрать веб-версию (Vite)
        run: npm run build

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Добавить платформу Android (если ещё не добавлена)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Дать права на выполнение gradlew
        run: chmod +x ./android/gradlew

      - name: Собрать debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: vpn-for-good-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
